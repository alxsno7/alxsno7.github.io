<html lang = "en">
    <head>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="photos.css">
        <title>Photos</title>
        <link rel="icon" type="image/x-icon" href="icon.jpg">
   
        <meta charset="UTF-8">
        <meta name="description" content="Engineering student portfolio site">
        <meta name="keywords" content="Engineering, Portfolio, Projects, Photos, University of British Columbia, UBC, LinkedIn">
        <meta name="author" content="Alex Sung">
    </head>

    <body>
        <div id="nav-placeholder"></div>
        <script>
            fetch('navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('nav-placeholder').innerHTML = data;
                });
        </script>

        <p>
            <h1 id="album-2">UBC at Night</h1>
            <div class="photo-album" style="background-color: black; color: white;">
                <div>
                    <img src="media\photos\ubc\amsnestnightlight.jpg" alt="ALSC" class="photo">
                    <h2 class="photo-title">AMS Nest Nightlight</h2>
                    <p class="photo-description">2025/10/11 @ UBC</p>
                </div>
                    
                <div>
                    <img src="media\photos\ubc\ladnerclocktower.jpg" alt="Photo 2" class="photo">
                    <h2 class="photo-title">Ladner Clock Tower</h2>
                    <p class="photo-description">2025/10/11 @ UBC</p>
                </div>
                <div>
                    <img src="media\photos\ubc\buchanancourtyard.jpg" alt="Photo 3" class="photo">
                    <h2 class="photo-title">Buchanan Courtyard</h2>
                    <p class="photo-description">2025/10/11 @ UBC</p>
                </div>
            </div>
            <br>
        </p>

        <p>
            <h1 id="album-1">UBC Campus</h1>
            <div class="photo-album" style="background-color: white; color: black;">
                <div>
                <img src="media\photos\ubc\lifebuilding.jpg" alt="ALSC" class="photo">
                    <h2 class="photo-title">Life Building</h2>
                    <p class="photo-description">2025/10/10 @ UBC</p>
                </div>
                <div>
                    <img src="media\photos\ubc\alsc.jpg" alt="Photo 2" class="photo">
                    <h2 class="photo-title">ALSC</h2>
                    <p class="photo-description">2025/10/17 @ UBC</p>
                </div>
                <div>
                    <img src="media\photos\ubc\exchangebay11.jpg" alt="Photo 3" class="photo">
                    <h2 class="photo-title">Exchange @ Bay 11</h2>
                    <p class="photo-description">2025/10/11 @ UBC</p>
                </div>
            </div>
        </p>

</html>
